name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation as a Q leading a workout.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed solution
  - type: markdown
    attributes:
      value: |
        Note: v0.1 scope is fixed by the spec. Requests may be scheduled for a later release.
