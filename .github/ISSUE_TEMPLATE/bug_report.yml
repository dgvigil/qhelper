name: Bug report
description: Something in Q Helper is not working
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not report security vulnerabilities here. See SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and OS version
      placeholder: iPhone 15, iOS 18.1 / Pixel 8, Android 15
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Q Helper version
      placeholder: 0.1.0 (1)
